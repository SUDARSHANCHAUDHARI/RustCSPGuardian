[package]
name = "cspguard"
version = "1.1.1"
edition = "2021"
authors = ["Sudarshan Chaudhari <sunny.sudarshan@gmail.com>"]
description = "Check whether a website can be embedded in iframe-based digital signage environments"
license = "MIT"
repository = "https://github.com/SUDARSHANCHAUDHARI/RustCSPGuardian"
readme = "README.md"
keywords = ["csp", "iframe", "headers", "security", "cli"]
categories = ["command-line-utilities", "web-programming"]

[lib]
name = "cspguard"
path = "src/lib.rs"

[[bin]]
name = "cspguard"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
colored = "2"
url = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
wiremock = "0.6"
